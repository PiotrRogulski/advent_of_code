name: advent_of_code
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0-271.0.dev
  flutter: ^3.49.0-1.0.pre-256

dependencies:
  characters: ^1.4.1
  collection: ^1.19.1
  cupertino_ui: ^1.1.1
  dio: ^5.11.1
  dispose_scope: ^2.1.0
  dynamic_color: ^2.1.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_adaptive_scaffold: ^0.3.3+1
  flutter_localizations:
    sdk: flutter
  gap: ^3.0.1
  go_router: ^18.0.2
  intl: ^0.20.3
  leancode_hooks: ^0.1.2+1
  material_ui: ^1.5.0
  meta: ^1.19.0
  more: ^4.7.0
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  vector_math: ^2.4.3
  z3: ^0.1.0

dev_dependencies:
  arb_utils:
    git: https://github.com/sbrsubuvga/arb_utils
  build_runner: ^2.16.1
  code_builder: ^4.12.0
  dart_style: ^3.1.13
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  leancode_lint: ^27.0.0

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true

  assets:
    - assets/inputs/y2022/
    - assets/inputs/y2023/
    - assets/inputs/y2024/
    - assets/inputs/y2025/

  fonts:
    - family: Material Symbols Rounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
